name: riftwave_music
description: "RiftWave Music — Free, open-source music streaming. No ads, no tracking, no account required."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.2

  just_audio: ^0.9.43
  audio_service: ^0.18.17

  youtube_explode_dart: ^2.3.8

  palette_generator: ^0.3.3+4

  dynamic_color: ^1.7.0

  hive_flutter: ^1.1.0
  hive: ^2.2.3

  dio: ^5.7.0

  cached_network_image: ^3.4.1

  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  shimmer: ^3.0.0

  path_provider: ^2.1.5

  shared_preferences: ^2.3.5

  connectivity_plus: ^6.1.2

  permission_handler: ^11.3.1

  share_plus: ^10.1.4

  cupertino_icons: ^1.0.8

  google_fonts: ^6.2.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  hive_generator: ^2.0.1

  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
